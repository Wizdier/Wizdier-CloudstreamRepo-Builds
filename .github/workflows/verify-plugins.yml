name: verify-plugins

# Guards against the v215-style packaging bug: plugins.json fileHash/fileSize
# not refreshed after a .cs3 rebuild -> every install fails hash verification.
on:
  push:
    paths:
      - "plugins.json"
      - "*.cs3"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify plugins.json matches the actual .cs3 bytes
        run: python .github/verify_plugins.py
